<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tabs - Machine Coding Question</title>
</head>
<body>
    <div class="heading">
        <h3>Tabs Machine Coding Question</h3>
    </div>

    <div class="section">
        <div class="tab-title-container">
            <button type="button" class="tab-btn tab-button active" data-tab="home">Home</button>
            <button type="button" class="tab-btn tab-button" data-tab="profile">Profile</button>
            <button type="button" class="tab-btn  tab-button" data-tab="setting">Settings</button>
        </div>
        <div class="tab-content-container">
            <div id="home" class="tab-content active">
                <span>Home Content</span>
            </div>
            <div id="profile" class="tab-content">
                <span>Profile Content</span>
            </div>
            <div id="setting" class="tab-content">
                <span>Settings Content</span>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
