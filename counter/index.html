<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Counter - Machine Coding Problem</title>
  </head>
  <body>
    <div>
      <h1>Counter App</h1>
      <div id="counter-container">
        <button id="decrement-ten" value="-10">-10</button>
        <button id="decrement-one" value="-1">-1</button>
        <span id="counter-value"></span>
        <button id="increment-one" value="+1">+1</button>
        <button id="increment-ten" value="+10">+10</button>
        <button id="reset-counter" value="reset" data-action="reset">
          Reset
        </button>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
